<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación - Boda & Bautizo</title>
    <!-- Fuentes para que el texto sea elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           1. COLORES EXACTOS DE LA IMAGEN
           ========================================= */
        :root {
            --fondo-oscuro: #071221;       /* Azul muy oscuro */
            --fondo-claro: #113355;        /* Azul marino para el degradado */
            --color-petalo: rgba(120, 180, 230, 0.6); /* Azul claro con brillo */
            --texto-blanco: #ffffff;
            --texto-azul: #a1c4e6;
        }

        /* =========================================
           2. ESTILOS GENERALES Y FONDO
           ========================================= */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barras de desplazamiento */
            background: linear-gradient(to bottom, var(--fondo-claro), var(--fondo-oscuro));
            font-family: 'Montserrat', sans-serif;
            color: var(--texto-blanco);
        }

        /* Contenedor donde caen los pétalos */
        #contenedor-petalos {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* No bloquea los clics */
            z-index: 1;
        }

        /* =========================================
           3. DISEÑO DE LOS PÉTALOS (NO CAMBIA SU FUNCIÓN)
           ========================================= */
        .petalo {
            position: absolute;
            background: var(--color-petalo);
            border-radius: 50% 0 50% 50%; /* Forma de pétalo */
            box-shadow: 0 0 10px rgba(120, 180, 230, 0.4); /* Brillo suave */
            filter: blur(1px); /* Efecto desenfocado como en la foto */
            animation: caer linear infinite;
        }

        /* Animación de caída */
        @keyframes caer {
            0% {
                transform: translate3d(0, -10vh, 0) rotate(0deg) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate3d(-20vw, 110vh, 0) rotate(360deg) scale(0.8);
                opacity: 0;
            }
        }

        /* =========================================
           4. CONTENIDO (Texto y Gráfico)
           ========================================= */
        .contenido {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Gráfico central */
        .grafico {
            width: 100px;
            height: 100px;
            position: relative;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .anillo {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }
        .anillo:nth-child(1) { width: 80px; height: 80px; transform: rotate(30deg); border-color: #8ab4d4; }
        .anillo:nth-child(2) { width: 90px; height: 50px; transform: rotate(-40deg); border-color: #d4b87e; }
        .anillo:nth-child(3) { width: 50px; height: 90px; transform: rotate(45deg); border-color: rgba(255,255,255,0.2); }
        .punto-central {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 15px white;
        }

        /* Textos */
        .subtitulo {
            font-size: 0.9rem;
            letter-spacing: 4px;
            border: 1px solid rgba(138, 180, 212, 0.5);
            padding: 10px 30px;
            border-radius: 50px;
            color: var(--texto-azul);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .nombres {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            line-height: 1.2;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            margin: 10px 0;
        }

        .nombres .ampersand {
            font-size: 2rem;
            color: #6bb2d1;
            font-family: 'Montserrat', sans-serif;
        }

        .fecha {
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: var(--texto-azul);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 1. Contenedor donde JavaScript inyecta los pétalos -->
    <div id="contenedor-petalos"></div>

    <!-- 2. Contenido visual de la invitación -->
    <div class="contenido">
        
        <div class="grafico">
            <div class="anillo"></div>
            <div class="anillo"></div>
            <div class="anillo"></div>
            <div class="punto-central"></div>
        </div>

        <div class="subtitulo">Boda & Bautizo</div>
        
        <div class="nombres">
            María del Carmen <span class="ampersand">&</span><br>
            Jesús Eduardo
        </div>
        
        <div class="fecha">10 · OCTUBRE · 2026</div>
        
    </div>

    <!-- 3. JavaScript para crear la caída de pétalos -->
    <script>
        const contenedor = document.getElementById('contenedor-petalos');
        const cantidadPetalos = 50; // Puedes subir o bajar este número

        function crearPetalo() {
            const petalo = document.createElement('div');
            petalo.classList.add('petalo');

            // Tamaño aleatorio
            const tamaño = Math.random() * 20 + 10;
            petalo.style.width = `${tamaño}px`;
            petalo.style.height = `${tamaño}px`;

            // Posición inicial horizontal aleatoria
            petalo.style.left = `${Math.random() * 100}vw`;

            // Duración de la caída (entre 8 y 18 segundos)
            const duracion = Math.random() * 10 + 8;
            petalo.style.animationDuration = `${duracion}s`;

            // Retraso para que no caigan todos al mismo tiempo
            const retraso = Math.random() * 10;
            petalo.style.animationDelay = `${retraso}s`;

            // Rotación inicial
            petalo.style.transform = `rotate(${Math.random() * 360}deg)`;

            contenedor.appendChild(petalo);
        }

        // Generar los pétalos iniciales
        for (let i = 0; i < cantidadPetalos; i++) {
            crearPetalo();
        }

        // (Opcional) Si quieres que salgan pétalos nuevos constantemente:
        // setInterval(crearPetalo, 500); 
    </script>

</body>
</html>
