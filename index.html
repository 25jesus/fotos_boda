<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💍 Comparte tus fotos - Nuestra Boda</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --rosa: #e8b4b8;
    --rosa-oscuro: #c98b90;
    --dorado: #d4af7a;
    --crema: #fdf6f0;
    --texto: #3a2e2e;
    --texto-suave: #8a7a7a;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Georgia', 'Playfair Display', serif;
    background: linear-gradient(135deg, #fdf6f0 0%, #f5e6e0 100%);
    color: var(--texto);
    min-height: 100vh;
    padding: 20px 16px 60px;
}

.container {
    max-width: 560px;
    margin: 0 auto;
}

/* ===== HEADER ===== */
.header {
    text-align: center;
    margin-bottom: 32px;
    padding-top: 20px;
}

.header .emoji {
    font-size: 3rem;
    margin-bottom: 8px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

.header h1 {
    font-size: 1.9rem;
    font-weight: 400;
    letter-spacing: 2px;
    color: var(--rosa-oscuro);
    margin-bottom: 8px;
}

.header p {
    font-size: 0.95rem;
    color: var(--texto-suave);
    font-style: italic;
    line-height: 1.5;
}

.divider {
    width: 80px;
    height: 1px;
    background: var(--dorado);
    margin: 16px auto;
}

/* ===== CARD ===== */
.card {
    background: #fff;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 10px 40px rgba(200, 150, 150, 0.15);
    margin-bottom: 20px;
    border: 1px solid #f5e0e0;
}

/* ===== FORM ===== */
label {
    display: block;
    font-size: 0.85rem;
    color: var(--texto-suave);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    font-family: 'Segoe UI', sans-serif;
}

input[type="text"],
textarea {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #f0e0e0;
    border-radius: 12px;
    font-size: 1rem;
    font-family: 'Segoe UI', sans-serif;
    color: var(--texto);
    background: var(--crema);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 16px;
}

input[type="text"]:focus,
textarea:focus {
    border-color: var(--rosa);
}

textarea {
    resize: vertical;
    min-height: 70px;
}

/* ===== UPLOAD ZONE ===== */
.upload-zone {
    border: 2px dashed var(--rosa);
    border-radius: 16px;
    padding: 32px 20px;
    text-align: center;
    background: var(--crema);
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 16px;
}

.upload-zone:hover,
.upload-zone.dragover {
    background: #faeae5;
    border-color: var(--rosa-oscuro);
    transform: scale(1.01);
}

.upload-zone .icon {
    font-size: 2.5rem;
    margin-bottom: 8px;
}

.upload-zone .text {
    font-size: 0.95rem;
    color: var(--rosa-oscuro);
    font-weight: 600;
    font-family: 'Segoe UI', sans-serif;
}

.upload-zone .sub {
    font-size: 0.78rem;
    color: var(--texto-suave);
    margin-top: 4px;
    font-family: 'Segoe UI', sans-serif;
}

input[type="file"] {
    display: none;
}

/* ===== PREVIEW ===== */
.preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
}

.preview-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    background: #f0e0e0;
}

.preview-item img,
.preview-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.preview-item .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(200, 60, 60, 0.9);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
}

.preview-item .badge {
    position: absolute;
    bottom: 4px;
    left: 4px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 0.6rem;
    padding: 2px 5px;
    border-radius: 4px;
    font-family: 'Segoe UI', sans-serif;
}

/* ===== BUTTONS ===== */
.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Segoe UI', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
}

.btn-primary {
    background: linear-gradient(135deg, var(--rosa) 0%, var(--rosa-oscuro) 100%);
    color: #fff;
    box-shadow: 0 6px 20px rgba(201, 139, 144, 0.4);
}

.btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(201, 139, 144, 0.5);
}

.btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* ===== PROGRESS ===== */
.progress-bar {
    width: 100%;
    height: 6px;
    background: #f0e0e0;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
    display: none;
}

.progress-bar.active {
    display: block;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rosa) 0%, var(--dorado) 100%);
    width: 0%;
    transition: width 0.3s;
}

/* ===== STATUS ===== */
.status-msg {
    font-size: 0.85rem;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 12px;
    font-family: 'Segoe UI', sans-serif;
    display: none;
}

.status-msg.success {
    background: #e6f5e6;
    color: #2d7a2d;
    display: block;
}

.status-msg.error {
    background: #fce8e8;
    color: #a02020;
    display: block;
}

.status-msg.info {
    background: #e8f0fc;
    color: #2a5a9a;
    display: block;
}

/* ===== GALLERY ===== */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
    margin-top: 12px;
}

.gallery-item {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    overflow: hidden;
    background: #f0e0e0;
    cursor: pointer;
    transition: transform 0.2s;
}

.gallery-item:hover {
    transform: scale(1.03);
}

.gallery-item img,
.gallery-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.gallery-item .guest {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
    color: #fff;
    font-size: 0.65rem;
    padding: 12px 6px 4px;
    font-family: 'Segoe UI', sans-serif;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
}

.gallery-title {
    font-size: 1.1rem;
    color: var(--rosa-oscuro);
    text-align: center;
    margin: 24px 0 12px;
    letter-spacing: 1px;
}

.empty-gallery {
    text-align: center;
    color: var(--texto-suave);
    font-style: italic;
    padding: 20px;
    font-size: 0.9rem;
}

/* ===== LIGHTBOX ===== */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
}

.lightbox.active {
    display: flex;
}

.lightbox img,
.lightbox video {
    max-width: 100%;
    max-height: 85vh;
    border-radius: 8px;
}

.lightbox .close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
}

.lightbox .close:hover {
    background: rgba(255, 255, 255, 0.3);
}

.lightbox .caption {
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    color: #fff;
    text-align: center;
    font-family: 'Segoe UI', sans-serif;
    font-size: 0.9rem;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
}
</style>
</head>
<body>
<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="emoji">💍</div>
        <h1>Nuestra Boda</h1>
        <div class="divider"></div>
        <p>Comparte los momentos que captures<br>y ayúdanos a guardar este día tan especial</p>
    </div>

    <!-- ===== FORMULARIO DE SUBIDA ===== -->
    <div class="card">
        <label for="guestName">👤 Tu nombre *</label>
        <input type="text" id="guestName" placeholder="Ej. María González" maxlength="60" />

        <label for="guestMessage">💌 Dedicatoria (opcional)</label>
        <textarea id="guestMessage" placeholder="Un mensaje para los novios..." maxlength="300"></textarea>

        <div class="upload-zone" id="uploadZone">
            <div class="icon">📷</div>
            <div class="text">Toca para subir fotos o videos</div>
            <div class="sub">Puedes seleccionar varios a la vez (máx. 10)</div>
        </div>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple />

        <div class="preview-grid" id="previewGrid"></div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status-msg" id="statusMsg"></div>

        <button class="btn btn-primary" id="uploadBtn" disabled>
            ✨ Compartir con los novios
        </button>
    </div>

    <!-- ===== GALERÍA ===== -->
    <div class="gallery-title">📸 Álbum de la boda</div>
    <div class="card">
        <div class="gallery" id="gallery"></div>
        <div class="empty-gallery" id="emptyGallery">Aún no hay fotos. ¡Sé el primero en compartir!</div>
    </div>
</div>

<!-- ===== LIGHTBOX ===== -->
<div class="lightbox" id="lightbox">
    <button class="close" id="lightboxClose">✕</button>
    <div id="lightboxContent"></div>
    <div class="caption" id="lightboxCaption"></div>
</div>

<script>
(function() {
    // ══════════════════════════════════════
    // CONFIGURACIÓN SUPABASE
    // ══════════════════════════════════════
    const SUPABASE_URL = "https://zavonkfpunwwqjliojtb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_MEkptp0YhHcsTLDPoIl0Nw_s3kMyYo9";
    const BUCKET = "wedding-photos";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50 MB
    const MAX_FILES = 10;

    // ══════════════════════════════════════
    // REFERENCIAS DOM
    // ══════════════════════════════════════
    const guestNameEl = document.getElementById('guestName');
    const guestMessageEl = document.getElementById('guestMessage');
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const previewGrid = document.getElementById('previewGrid');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusMsg = document.getElementById('statusMsg');
    const galleryEl = document.getElementById('gallery');
    const emptyGallery = document.getElementById('emptyGallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxContent = document.getElementById('lightboxContent');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const lightboxClose = document.getElementById('lightboxClose');

    let selectedFiles = [];

    // ══════════════════════════════════════
    // SELECCIÓN DE ARCHIVOS
    // ══════════════════════════════════════
    uploadZone.addEventListener('click', () => fileInput.click());

    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
        fileInput.value = ''; // permitir volver a seleccionar el mismo archivo
    });

    function handleFiles(files) {
        const nuevos = Array.from(files);
        for (const f of nuevos) {
            if (selectedFiles.length >= MAX_FILES) {
                showStatus(`Máximo ${MAX_FILES} archivos por envío.`, 'error');
                break;
            }
            const isImage = f.type.startsWith('image/');
            const isVideo = f.type.startsWith('video/');
            if (!isImage && !isVideo) {
                showStatus(`"${f.name}" no es una imagen o video válido.`, 'error');
                continue;
            }
            if (f.size > MAX_FILE_SIZE) {
                showStatus(`"${f.name}" excede los 50 MB.`, 'error');
                continue;
            }
            // Evitar duplicados
            const yaExiste = selectedFiles.some(existing =>
                existing.name === f.name && existing.size === f.size
            );
            if (!yaExiste) selectedFiles.push(f);
        }
        renderPreview();
        updateButton();
    }

    function renderPreview() {
        previewGrid.innerHTML = '';
        selectedFiles.forEach((file, i) => {
            const item = document.createElement('div');
            item.className = 'preview-item';
            const isVideo = file.type.startsWith('video/');
            const url = URL.createObjectURL(file);
            if (isVideo) {
                item.innerHTML = `<video src="${url}" muted></video><span class="badge">🎥 Video</span>`;
            } else {
                item.innerHTML = `<img src="${url}" alt="" /><span class="badge">📷 Foto</span>`;
            }
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove';
            removeBtn.textContent = '✕';
            removeBtn.onclick = (e) => {
                e.stopPropagation();
                URL.revokeObjectURL(url);
                selectedFiles.splice(i, 1);
                renderPreview();
                updateButton();
            };
            item.appendChild(removeBtn);
            previewGrid.appendChild(item);
        });
    }

    function updateButton() {
        uploadBtn.disabled = selectedFiles.length === 0 || !guestNameEl.value.trim();
    }

    guestNameEl.addEventListener('input', updateButton);

    // ══════════════════════════════════════
    // SUBIDA DE ARCHIVOS
    // ══════════════════════════════════════
    uploadBtn.addEventListener('click', async () => {
        const guestName = guestNameEl.value.trim();
        if (!guestName) {
            showStatus('Por favor escribe tu nombre.', 'error');
            return;
        }
        if (selectedFiles.length === 0) {
            showStatus('Selecciona al menos un archivo.', 'error');
            return;
        }

        uploadBtn.disabled = true;
        progressBar.classList.add('active');
        progressFill.style.width = '0%';
        showStatus('Subiendo archivos...', 'info');

        const total = selectedFiles.length;
        let completados = 0;
        const errores = [];
        const archivosSubidos = [...selectedFiles];

        for (const file of archivosSubidos) {
            try {
                await subirArchivo(file, guestName);
                completados++;
                progressFill.style.width = `${(completados / total) * 100}%`;
            } catch (err) {
                console.error('Error al subir:', file.name, err);
                errores.push(file.name);
            }
        }

        if (errores.length === 0) {
            showStatus(`¡Gracias ${guestName}! ${completados} archivo(s) compartido(s) 💕`, 'success');
            selectedFiles = [];
            renderPreview();
            guestMessageEl.value = '';
        } else {
            showStatus(`Se subieron ${completados}/${total}. Fallaron: ${errores.join(', ')}`, 'error');
            // Eliminar los que sí se subieron
            selectedFiles = selectedFiles.filter(f => errores.includes(f.name));
            renderPreview();
        }

        setTimeout(() => {
            progressBar.classList.remove('active');
            progressFill.style.width = '0%';
        }, 1500);

        updateButton();
        cargarGaleria();
    });

    async function subirArchivo(file, guestName) {
        // Generar path único
        const timestamp = Date.now();
        const random = Math.random().toString(36).slice(2, 8);
        const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
        const path = `${timestamp}_${random}_${safeName}`;

        // 1) Subir a Storage
        const { error: uploadError } = await supabase.storage
            .from(BUCKET)
            .upload(path, file, {
                cacheControl: '3600',
                upsert: false,
                contentType: file.type
            });

        if (uploadError) throw uploadError;

        // 2) Obtener URL pública
        const { data: urlData } = supabase.storage
            .from(BUCKET)
            .getPublicUrl(path);

        // 3) Insertar registro en la tabla
        const mediaType = file.type.startsWith('video/') ? 'video' : 'photo';
        const { error: dbError } = await supabase
            .from('wedding_media')
            .insert({
                guest_name: guestName,
                message: guestMessageEl.value.trim() || null,
                media_type: mediaType,
                file_url: urlData.publicUrl,
                file_path: path,
                file_name: file.name,
                file_size: file.size,
                mime_type: file.type
            });

        if (dbError) {
            // Si falla la BD, eliminar el archivo del storage
            await supabase.storage.from(BUCKET).remove([path]);
            throw dbError;
        }
    }

    function showStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className = `status-msg ${type}`;
    }

    // ══════════════════════════════════════
    // GALERÍA
    // ══════════════════════════════════════
    async function cargarGaleria() {
        const { data, error } = await supabase
            .from('wedding_media')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(60);

        if (error) {
            console.error('Error cargando galería:', error);
            return;
        }

        if (!data || data.length === 0) {
            galleryEl.innerHTML = '';
            emptyGallery.style.display = 'block';
            return;
        }

        emptyGallery.style.display = 'none';
        galleryEl.innerHTML = data.map(item => {
            const media = item.media_type === 'video'
                ? `<video src="${item.file_url}" muted preload="metadata"></video>`
                : `<img src="${item.file_url}" loading="lazy" alt="" />`;
            return `
                <div class="gallery-item"
                     data-url="${escapeHtml(item.file_url)}"
                     data-type="${escapeHtml(item.media_type)}"
                     data-guest="${escapeHtml(item.guest_name)}"
                     data-msg="${escapeHtml(item.message || '')}">
                    ${media}
                    <span class="guest">${escapeHtml(item.guest_name)}</span>
                </div>`;
        }).join('');

        document.querySelectorAll('.gallery-item').forEach(el => {
            el.addEventListener('click', () => {
                abrirLightbox(el.dataset.url, el.dataset.type, el.dataset.guest, el.dataset.msg);
            });
        });
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c]));
    }

    function abrirLightbox(url, type, guest, msg) {
        lightboxContent.innerHTML = type === 'video'
            ? `<video src="${url}" controls autoplay></video>`
            : `<img src="${url}" alt="" />`;
        lightboxCaption.textContent = msg ? `${guest} — "${msg}"` : guest;
        lightbox.classList.add('active');
    }

    lightboxClose.addEventListener('click', () => {
        lightbox.classList.remove('active');
        lightboxContent.innerHTML = '';
    });

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
            lightbox.classList.remove('active');
            lightboxContent.innerHTML = '';
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) {
            lightbox.classList.remove('active');
            lightboxContent.innerHTML = '';
        }
    });

    // ══════════════════════════════════════
    // REALTIME: nuevas fotos en vivo
    // ══════════════════════════════════════
    supabase
        .channel('wedding-media')
        .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'wedding_media' },
            () => cargarGaleria()
        )
        .subscribe();

    // ══════════════════════════════════════
    // INICIO
    // ══════════════════════════════════════
    cargarGaleria();
})();
</script>
</body>
</html>
